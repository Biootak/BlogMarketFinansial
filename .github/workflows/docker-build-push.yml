name: Docker Build & Push (ghcr)

# ─────────────────────────────────────────────────────────────────────────────
# روش دیپلوی Azure (استاندارد — 2026-08-16):
#   push به main → این workflow روی runner قوی GitHub تصویرها را build و به
#   ghcr.io push می‌کند → cron-poll روی VM هر دقیقه pull می‌کند (بدون build روی
#   VM — B2ats_v2 با 1GB RAM نمی‌تواند next build را در زمان معقول انجام دهد).
#
# build در CI به DB متصل نمی‌شود (cacheComponents: false در next.config.ts —
# «next build needs no DB connection»). بنابراین DATABASE_URL/AUTH_SECRET در
# build فقط مقدارهای placeholder هستند؛ مقادیر واقعی در runtime از .env روی VM
# می‌آیند. این یعنی image عمومی ghcr حاوی هیچ داده/راز واقعی نیست.
#
# مرجع: docs.github.com/actions/guides/publishing-docker-images
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # تغییرات مستندات/build نباید تصویر را دوباره build کند
    paths-ignore:
      - '*.md'
      - 'AGENTS*.md'
      - 'PDK.md'
      - 'pdk/**'
      - 'deploy/**'
      - 'docs/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # درایور docker-container → GHA cache (type=gha) مطمئن و بین run ها مشترک
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fm-blog-web:main
          build-args: |
            NODE_IMAGE=node:22-alpine
            DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
            AUTH_SECRET=ci-build-only-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cron
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fm-blog-cron:main
          build-args: |
            CRON_IMAGE=alpine:3.20
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy result
        run: echo "✅ Images pushed — VM cron-poll picks them up within a minute."
