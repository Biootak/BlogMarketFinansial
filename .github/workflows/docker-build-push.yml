name: Docker Build & Push (ghcr)

# Azure deploy standard (2026-08-16):
# push to main -> build web+cron images on a fast GitHub runner -> push to
# ghcr.io -> the Azure VM cron-poll pulls every minute (no build on the VM).
# Build needs no DB (cacheComponents: false), so build args are placeholders;
# real secrets come from .env at runtime on the VM.
# Reference: docs.github.com/actions/guides/publishing-docker-images

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'deploy/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/biootak/fm-blog-web:main
          build-args: |
            NODE_IMAGE=node:22-alpine
            DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
            AUTH_SECRET=ci-build-only-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cron
          push: true
          tags: ghcr.io/biootak/fm-blog-cron:main
          build-args: |
            CRON_IMAGE=alpine:3.20
          cache-from: type=gha
          cache-to: type=gha,mode=max
