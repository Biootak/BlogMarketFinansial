name: Dependency safety

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/dependabot.yml
      - .github/workflows/dependency-safety.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/dependabot.yml
      - .github/workflows/dependency-safety.yml

permissions:
  contents: read

concurrency:
  group: dependency-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
