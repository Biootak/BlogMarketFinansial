name: Resolve Comment rejectedAt migration (one-off)

on:
  workflow_dispatch:

# one-off: mark 20260812000000_add_comment_rejected_at as applied on the
# production DB. The column already exists there (schema drift), so migrate
# deploy fails with P3018 until the migration is recorded as applied.
# This workflow will be removed after it runs successfully.

jobs:
  resolve:
    name: Mark migration applied
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get production config from Heroku
        id: db
        run: |
          CONFIG=$(curl -sS -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/config-vars")
          echo "database_url=$(echo "$CONFIG" | jq -r .DATABASE_URL)" >> "$GITHUB_OUTPUT"

      - name: Mark migration as applied
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: npx --yes prisma@6.19.3 migrate resolve --applied 20260812000000_add_comment_rejected_at --schema=./prisma/schema.prisma
