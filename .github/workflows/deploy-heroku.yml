name: Deploy to Heroku

on:
  push:
    branches:
      - main
      - master
  # اجازه دیپلوی دستی از GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Heroku
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Login to Heroku Container Registry ────────────────────────────
      - name: Login to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # ─── 3. Set up Docker Buildx (BuildKit) ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 4. Read production DB config from Heroku (source of truth) ────────
      # صفحات استاتیک/ISR در build-time به DB وصل می‌شوند، پس build باید به
      # همان DB production (RDS) متصل باشد، نه یک secret جدا که ممکن است
      # قدیمی/اشتباه باشد.
      - name: Get production DATABASE_URL from Heroku
        id: db
        run: |
          DB_URL=$(heroku config:get DATABASE_URL -a ${{ secrets.HEROKU_APP_NAME }})
          echo "database_url=$DB_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$(heroku config:get DIRECT_URL -a ${{ secrets.HEROKU_APP_NAME }})" >> "$GITHUB_OUTPUT"
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      # ─── 5. Build & Push Docker image to Heroku ───────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.heroku
          push: true
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ steps.db.outputs.database_url }}
            DIRECT_URL=${{ steps.db.outputs.direct_url }}

      # ─── 6. Release (deploy) روی Heroku ──────────────────────────────────
      - name: Release on Heroku
        run: |
          curl -n -X POST https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/container/release \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d '{"process_types":{"web":"registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web"}}'

      # ─── 7. اطلاع‌رسانی موفقیت ──────────────────────────────────────────
      - name: Deployment successful
        run: |
          echo "✅ Deployed successfully to https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
