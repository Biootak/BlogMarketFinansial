name: Deploy to Heroku

on:
  push:
    branches:
      - main
      - master
  # اجازه دیپلوی دستی از GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Heroku
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Login to Heroku Container Registry ────────────────────────────
      - name: Login to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # ─── 3. Set up Docker Buildx (BuildKit) ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 4. Build & Push Docker image to Heroku ───────────────────────────
      # DATABASE_URL در build time لازم است فقط اگر next build
      # از Prisma استفاده کند (static generation). اگر پروژه fully dynamic
      # باشد، می‌توانی DATABASE_URL را از build arg حذف کنی.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.heroku
          push: true
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      # ─── 5. Release (deploy) روی Heroku ──────────────────────────────────
      - name: Release on Heroku
        run: |
          curl -n -X POST https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/container/release \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -d '{"process_types":{"web":"registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web"}}'

      # ─── 6. اطلاع‌رسانی موفقیت ──────────────────────────────────────────
      - name: Deployment successful
        run: |
          echo "✅ Deployed successfully to https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
