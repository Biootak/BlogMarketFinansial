name: Refresh Market Rates

# هر 5 دقیقه اجرا می‌شه.
# scraping TGJU + bonbast + USDT اینجا (GitHub-hosted runner) انجام می‌شه.
# web dyno فقط نتیجه JSON را می‌گیره، ذخیره می‌کنه، cache bust می‌کنه.
# → هیچ scraping روی web dyno انجام نمی‌شه → صفر spike RAM.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install minimal deps for scraper
        run: npm ci --ignore-scripts --only=production 2>/dev/null || npm install --ignore-scripts

      # DATABASE_URL از Heroku (source of truth) خوانده می‌شود — نه از یک secret
      # جدا که ممکن است قدیمی شود. 2026-08-14: سکرت DATABASE_URL قدیمی شده بود
      # (Auth failed) و workflow ۲۰+ ساعت fail می‌شد → snapshot کهنه → dyno خودش
      # scrape می‌کرد → R14 مداوم. همین الگو در deploy-heroku.yml و backup-nightly.yml.
      - name: Get production DATABASE_URL from Heroku
        id: db
        run: |
          CONFIG=$(curl -sS -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            "https://api.heroku.com/apps/${{ secrets.HEROKU_APP_NAME }}/config-vars")
          echo "database_url=$(echo "$CONFIG" | jq -r .DATABASE_URL)" >> "$GITHUB_OUTPUT"

      - name: Setup Prisma client
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: npx prisma generate

      - name: Scrape & push rates
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          USDT_PREMIUM_PERCENT: ${{ secrets.USDT_PREMIUM_PERCENT }}
          TGJU_SCRAPER_ENABLED: 'true'
          TGJU_FETCH_TTL_MS: '0'
          NODE_ENV: 'production'
        run: |
          npx tsx scripts/scrape-and-push-rates.ts
