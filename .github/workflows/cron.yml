name: Cron Jobs

# ⛔ غیرفعال شد — 2026-08
# GitHub Actions schedule تأخیر ۱۰-۳۰ دقیقه دارد و از ۲۰۰۰ دقیقه/ماه رایگان مصرف می‌کند.
# تمام cron job ها به cron-job.org منتقل شدند (دقیق‌تر، رایگان، unlimited).
# این workflow فقط برای اجرای دستی (تست/debug) نگه داشته شده.
on:
  # اجرای دستی
  workflow_dispatch:

jobs:
  # ─── پست‌های scheduled ──────────────────────────────────────────────────
  publish-scheduled-posts:
    name: Publish Scheduled Posts
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-scheduled-posts
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/publish-scheduled-posts"

  # ─── نرخ‌های بازار ──────────────────────────────────────────────────────
  refresh-market-rates:
    name: Refresh Market Rates
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh-market-rates
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-market-rates"

  # ─── backup دیتابیس (شبانه) ─────────────────────────────────────────────
  # JSON کامل (محتوای سایت + تنظیمات) را می‌سازد و در S3-compatible آینه می‌کند
  # تا روی filesystem اپمرال (Heroku/Vercel) از بین نرود.
  db-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/backup"
