# Lighthouse Audit — اجرای تست سرعت موبایل روی همهٔ صفحات عمومی
# ------------------------------------------------------------------
# روی رانر تمیز گیت‌هاب (ubuntu-latest) اجرا می‌شود — اعداد قابل‌اعتماد
# بدون وابستگی به CPU ماشین توسعه‌دهنده یا سهمیهٔ PageSpeed (PSI).
#
# کاربرد:
#   gh workflow run lighthouse-audit                                   → همهٔ صفحات
#   gh workflow run lighthouse-audit -f url=.../exchanges             → یک صفحه
#   gh workflow run lighthouse-audit -f detail=true -f url=.../       → + تشخیص LCP/MT
#   gh run watch <run-id>  → خروجی جدول امتیازها در لاگ
#
# فقط workflow_dispatch — هیچ‌وقت روی push اجرا نمی‌شود و دیپلوی را
# trigger نمی‌کند (مسیر .github/workflows/** در paths-ignore دیپلوی است).
name: Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'صفحه (اختیاری) — فقط همین آدرس تست می‌شود'
        required: false
        type: string
      detail:
        description: 'خروجی تشخیصی (LCP element + main-thread + long tasks)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: lighthouse-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Mobile Lighthouse on public pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run Lighthouse (mobile) on public pages
        shell: bash
        run: |
          DETAIL="${{ inputs.detail }}"
          if [ -n "${{ inputs.url }}" ]; then
            name="custom"
            url="${{ inputs.url }}"
            PAGES=("$name|$url")
          else
            PAGES=(
              "home|https://financialmarket.page/"
              "exchanges|https://financialmarket.page/exchanges"
              "money-transfer|https://financialmarket.page/money-transfer"
              "exchange-rates|https://financialmarket.page/exchange-rates"
              "archive|https://financialmarket.page/archive"
              "about|https://financialmarket.page/about"
            )
          fi
          echo "== Lighthouse Mobile (strategy: mobile) =="
          echo "PAGE | PERF A11Y BP SEO | FCP LCP TBT CLS TTFB"
          for entry in "${PAGES[@]}"; do
            name="${entry%%|*}"
            url="${entry##*|}"
            out="/tmp/lh-$name.json"
            npx -y lighthouse "$url" --output=json --output-path="$out" --quiet \
              --chrome-flags="--headless=new --no-sandbox --disable-gpu" >/dev/null 2>&1 || true
            node -e '
              const fs = require("fs");
              const [f, n, detail] = [process.argv[1], process.argv[2], process.argv[3] === "true"];
              const r = JSON.parse(fs.readFileSync(f, "utf8"));
              const pct = id => Math.round((r.categories[id] || {}).score * 100);
              const m = id => { const a = r.audits[id]; return a ? (a.displayValue || a.numericValue || "-") : "-"; };
              console.log(
                n.padEnd(16),
                String(pct("performance")).padStart(4),
                String(pct("accessibility")).padStart(4),
                String(pct("best-practices")).padStart(4),
                String(pct("seo")).padStart(4),
                "|",
                m("first-contentful-paint").padStart(6),
                m("largest-contentful-paint").padStart(7),
                m("total-blocking-time").padStart(6),
                m("cumulative-layout-shift").padStart(7),
                m("server-response-time").padStart(8),
              );
              if (detail) {
                const lcp = r.audits["largest-contentful-paint-element"];
                if (lcp && lcp.details && lcp.details.items && lcp.details.items[0]) {
                  const it = lcp.details.items[0];
                  console.log("  LCP-el:", (it.node && it.node.snippet ? String(it.node.snippet).slice(0, 90) : it.url || "?"));
                }
                const ls = r.audits["layout-shifts"];
                if (ls && ls.details && ls.details.items) {
                  for (const it of ls.details.items.slice(0, 4)) {
                    console.log("  CLS-el score=" + it.score.toFixed(3), it.node && it.node.snippet ? String(it.node.snippet).slice(0, 70) : "?");
                  }
                }
                const mt = r.audits["mainthread-work-breakdown"];
                if (mt && mt.details && mt.details.items) {
                  const g = {};
                  for (const it of mt.details.items) g[it.group] = (g[it.group] || 0) + it.duration;
                  console.log("  MT:", Object.entries(g).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + "=" + (v / 1000).toFixed(2) + "s").join(" "));
                }
                const lt = r.audits["long-tasks"];
                if (lt && lt.details && lt.details.items) {
                  const top = lt.details.items.slice(0, 4).map(i => Math.round(i.duration) + "ms:" + (i.url ? i.url.split("/").pop().slice(0, 40) : "?"));
                  console.log("  Long-tasks:", top.join(" | "));
                }
                const boot = r.audits["bootup-time"];
                if (boot && boot.details && boot.details.items) {
                  const top = boot.details.items.filter(i => i.scripting > 0).sort((a, b) => b.scripting - a.scripting).slice(0, 3);
                  console.log("  Top scripting:", top.map(i => (i.url.split("/").pop() || "?").slice(0, 40) + "=" + (i.scripting / 1000).toFixed(2) + "s").join(" | "));
                }
              }
            ' "$out" "$name" "$DETAIL"
          done
          echo "== done =="
