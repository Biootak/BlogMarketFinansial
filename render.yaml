services:
  - type: web
    name: financialmarket
    runtime: docker
    dockerfilePath: ./Dockerfile.heroku
    region: frankfurt
    plan: free

    # Build arguments — مقادیر واقعی را در Render Dashboard > Environment ست کن
    dockerContext: .

    # Health check — Render از این برای rolling deploy استفاده می‌کند
    healthCheckPath: /api/ping

    # Auto-deploy از main branch
    autoDeploy: true
    branch: main

    # متغیرهای محیطی — همه مقادیر را در Render Dashboard ست کن
    # (مقادیر حساس را اینجا نگذار — فقط نام‌ها)
    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_OPTIONS
        value: --max-old-space-size=400

      - key: OUTPUT_STANDALONE
        value: "1"

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # --- Auth ---
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        value: https://financialmarket.page
      - key: NEXTAUTH_URL
        value: https://financialmarket.page
      - key: NEXTAUTH_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false

      # --- Database ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PRISMA_CONNECTION_LIMIT
        value: "3"
      - key: PRISMA_POOL_TIMEOUT
        value: "10"

      # --- App ---
      - key: APP_URL
        value: https://financialmarket.page
      - key: CRON_SECRET
        sync: false

      # --- Email ---
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: no-reply@financialmarket.page

      # --- Storage (S3/Filebase) ---
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: fm-blog
      - key: S3_BACKUP_BUCKET
        value: fm-blog
      - key: S3_ENDPOINT
        value: https://s3.filebase.io
      - key: S3_REGION
        value: auto
      - key: S3_PUBLIC_URL
        value: /uploads

      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: financialmarket_otp_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: "0"

      # --- Backup (Backblaze B2) ---
      - key: BACKUP_S3_PRIMARY_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_PRIMARY_SECRET_KEY
        sync: false
      - key: BACKUP_S3_PRIMARY_BUCKET
        value: financialmarket
      - key: BACKUP_S3_PRIMARY_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: BACKUP_S3_PRIMARY_REGION
        value: us-east-005
      - key: BACKUP_POST_LIMIT
        value: "500"
      - key: BACKUP_USER_LIMIT
        value: "5000"
      - key: BACKUP_COMMENT_LIMIT
        value: "1000"

      # --- Cache tuning ---
      - key: SAFE_CACHE_MAX_ENTRIES
        value: "300"
      - key: SAFE_CACHE_MAX_BYTES
        value: "52428800"
      - key: TGJU_FETCH_TTL_MS
        value: "360000"
