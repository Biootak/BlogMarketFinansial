# ============================================================================
# Docker Compose for Azure VM (fm-vm) — Financial Market Blog.
# ----------------------------------------------------------------------------
# 2026-08-16: تصویرها دیگر روی VM build نمی‌شوند — GitHub Actions آن‌ها را
# build و به ghcr.io push می‌کند (workflow: .github/workflows/docker-build-push.yml)
# و این compose فقط pull می‌کند. دلیل: B2ats_v2 (1GB RAM / 20% CPU پایه) نمی‌تواند
# next build را در زمان معقول انجام دهد (OOM + throttle).
#
# دیتابیس روی Azure Database for PostgreSQL (flexible server, B1ms رایگان) است
# و از طریق DATABASE_URL داخل .env داده می‌شود (sslmode=require).
#
# قبل از up (روی VM):
#   1) .env با همه متغیرهای Heroku + DATABASE_URL=postgresql://...azure... (sslmode=require)
#   2) docker compose --env-file .env -f deploy/docker-compose.azure.yml pull
#   3) docker compose --env-file .env -f deploy/docker-compose.azure.yml up -d
#
# pull_policy: always — هر `up -d` آخرین تصویر :main را دوباره می‌کشد.
# ============================================================================
services:
  web:
    image: ghcr.io/biootak/fm-blog-web:main
    pull_policy: always
    ports:
      - "3000:3000"
    # 2026-08-17: B2ats_v2 فقط 897MB RAM دارد. قبلاً کانتینر بدون سقف بود و
    # Node می‌توانست کل RAM + swap (۶۶۵MB) را بخورد. سقف 512m + heap 256m
    # (NODE_OPTIONS زیر) = ۵۰٪ سقف → طبق راهنمای 2026 (netdata/IBM) heap باید
    # ~۷۰٪ سقف باشد ولی اینجا non-heap + بافرهای Next را هم باید جا داد.
    mem_limit: 512m
    mem_reservation: 256m
    env_file:
      # نسبت به همین فایل (deploy/) — .env در ریشه رپو است
      - ../.env
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Next.js 16 image SSRF guard — IPv4-first DNS (همان کامنت compose ریشه)
      - NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=256
    volumes:
      # آپلودها بیرون از image — با redeploy پاک نمی‌شوند
      - uploads_data:/app/public/uploads
    restart: always
    # 2026-08-16: دیتابیس Azure از قبل migrate شده (restore شامل _prisma_migrations)
    # و CLI Prisma در تصویر standalone زنجیره‌ی وابستگی کامل ندارد (@prisma/config
    # → effect). برای همین boot مستقیماً server.js است؛ مایگریشن‌های آینده را
    # یک‌باره و دستی اجرا کنید (docker run --rm ... prisma migrate deploy).
    command: sh -c "node server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cron:
    # Sidecar — همان کرون‌های cron-job.org را داخل VM اجرا می‌کند
    image: ghcr.io/biootak/fm-blog-cron:main
    pull_policy: always
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      - APP_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set}
      - TZ=${TZ:-Asia/Tehran}
    depends_on:
      web:
        condition: service_healthy
    restart: always

volumes:
  uploads_data:
