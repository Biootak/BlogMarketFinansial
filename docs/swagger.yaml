openapi: 3.0.3
info:
  title: Biotak Go Backend API
  description: |
    RESTful API for Biotak - A Persian financial markets blog and content management platform.
    
    ## Authentication
    Most endpoints require authentication using JWT tokens. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_jwt_token>
    ```
    
    ## Rate Limiting
    - Global: 100 requests per minute
    - Authentication endpoints: 5 requests per minute
    - Upload endpoints: 10 requests per hour
    
  version: 1.0.0
  contact:
    name: Biotak API Support
    email: support@biotak.ir
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.biotak.ir
    description: Production server

tags:
  - name: health
    description: Health check endpoints
  - name: auth
    description: Authentication and authorization
  - name: posts
    description: Blog post management
  - name: comments
    description: Comment management
  - name: exchange-rates
    description: Currency and crypto exchange rates
  - name: upload
    description: File upload and management
  - name: reports
    description: Analytics and reporting (admin only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login or register endpoints

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Invalid request data"
            details:
              type: object
              additionalProperties: true
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
              format: uuid

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum: [USER, AUTHOR, ADMIN, SUPER_ADMIN]
        emailVerified:
          type: boolean

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
          nullable: true
        featuredImage:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, PUBLISHED]
        postType:
          type: string
          enum: [STANDARD, VIDEO, GALLERY, AUDIO]
        viewCount:
          type: integer
        readingTime:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/Author'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        videoUrl:
          type: string
          format: uri
          nullable: true
        audioUrl:
          type: string
          format: uri
          nullable: true
        galleryImages:
          type: array
          items:
            type: string
            format: uri

    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type: string
          format: uri
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        approved:
          type: boolean
        postId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/CommentAuthor'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    CommentAuthor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type: string
          format: uri
          nullable: true

    ExchangeRate:
      type: object
      properties:
        symbol:
          type: string
          example: "BTC"
        usdtPrice:
          type: number
          format: double
        irrPrice:
          type: number
          format: double
        change:
          type: number
          format: double
        globalPrice:
          type: number
          format: double

paths:
  /health:
    get:
      tags:
        - health
      summary: Basic health check
      description: Returns the health status of the application and its dependencies
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "connected"
                      redis:
                        type: string
                        example: "connected"
                  version:
                    type: string
                    example: "1.0.0"
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unhealthy"
                  services:
                    type: object

  /health/ready:
    get:
      tags:
        - health
      summary: Readiness probe
      description: Kubernetes readiness probe endpoint
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

  /health/live:
    get:
      tags:
        - health
      summary: Liveness probe
      description: Kubernetes liveness probe endpoint
      responses:
        '200':
          description: Service is alive

  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: User registration
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: Generate a new access token from a refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: User logout
      description: Invalidate the current access token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Get current user
      description: Get the currently authenticated user's information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts:
    get:
      tags:
        - posts
      summary: List posts with filters
      description: Retrieve a paginated list of posts with optional filters
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_REVIEW, PUBLISHED]
        - name: postType
          in: query
          schema:
            type: string
            enum: [STANDARD, VIDEO, GALLERY, AUDIO]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags:
        - posts
      summary: Create a new post
      description: Create a new post (requires authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                content:
                  type: string
                excerpt:
                  type: string
                featuredImage:
                  type: string
                  format: uri
                postType:
                  type: string
                  enum: [STANDARD, VIDEO, GALLERY, AUDIO]
                  default: STANDARD
                categoryIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                videoUrl:
                  type: string
                  format: uri
                audioUrl:
                  type: string
                  format: uri
                galleryImages:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts/{id}:
    get:
      tags:
        - posts
      summary: Get post by ID
      description: Retrieve a post by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - posts
      summary: Update a post
      description: Update a post (requires authentication and authorization)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                excerpt:
                  type: string
                featuredImage:
                  type: string
                  format: uri
                categoryIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                tagIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - posts
      summary: Delete a post
      description: Soft delete a post (requires admin role)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts/slug/{slug}:
    get:
      tags:
        - posts
      summary: Get post by slug
      description: Retrieve a post by its slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts/{id}/publish:
    post:
      tags:
        - posts
      summary: Publish a post
      description: Change post status to PUBLISHED (requires authentication and authorization)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/exchange-rates:
    get:
      tags:
        - exchange-rates
      summary: Get current exchange rates
      description: Get current exchange rates for cryptocurrencies
      parameters:
        - name: currencies
          in: query
          description: Comma-separated list of currencies (e.g., BTC,ETH,USDT)
          schema:
            type: string
      responses:
        '200':
          description: Exchange rates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExchangeRate'
                  timestamp:
                    type: string
                    format: date-time
                  source:
                    type: string
        '500':
          description: Failed to fetch exchange rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/exchange-rates/historical:
    get:
      tags:
        - exchange-rates
      summary: Get historical exchange rates
      description: Get historical exchange rates for one or more currencies within a date range
      parameters:
        - name: currency
          in: query
          description: Single currency code (e.g., BTC)
          schema:
            type: string
        - name: currencies
          in: query
          description: Comma-separated list of currencies (e.g., BTC,ETH,USDT)
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: Start date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End date (RFC3339 format)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Historical rates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        currency:
                          type: string
                        rate:
                          type: number
                        timestamp:
                          type: string
                          format: date-time
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/upload:
    post:
      tags:
        - upload
      summary: Upload a file
      description: Upload an image file with automatic processing and resizing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  originalUrl:
                    type: string
                    format: uri
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        size:
                          type: string
                        url:
                          type: string
                          format: uri
                        width:
                          type: integer
                        height:
                          type: integer
                  message:
                    type: string
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/upload/{filename}:
    delete:
      tags:
        - upload
      summary: Delete a file
      description: Delete a file from storage
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
