upstream nextjs_backend {
    server web:3000;
    keepalive 32;
}

upstream go_backend {
    server go-backend:8080;
    keepalive 32;
}

# Health check configuration
upstream nextjs_health {
    server web:3000;
    keepalive 2;
}

upstream go_health {
    server go-backend:8080;
    keepalive 2;
}

# Circuit breaker state storage
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Client body size limit
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Health check endpoints
    location /health/nextjs {
        proxy_pass http://nextjs_health/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /health/go {
        proxy_pass http://go_health/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Combined health check
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","services":{"nextjs":"check /health/nextjs","go":"check /health/go"}}';
    }

    # Go Backend API routes (v1)
    # These are the new Go endpoints
    location /api/v1/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Circuit breaker: if Go backend is down, try Next.js fallback
        proxy_next_upstream error timeout http_502 http_503 http_504;
        
        # Primary: Go backend
        proxy_pass http://go_backend/api/v1/;
        
        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 = @go_backend_fallback;
    }

    # Fallback to Next.js if Go backend fails
    location @go_backend_fallback {
        # Try to map /api/v1/* to /api/* for Next.js
        rewrite ^/api/v1/(.*)$ /api/$1 break;
        proxy_pass http://nextjs_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Add header to indicate fallback was used
        add_header X-Served-By "nextjs-fallback" always;
    }

    # Next.js API routes (legacy)
    # These will gradually be migrated to Go
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://nextjs_backend/api/;
        
        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Add header to indicate this is Next.js
        add_header X-Served-By "nextjs" always;
    }

    # Next.js frontend (all other routes)
    location / {
        proxy_pass http://nextjs_backend/;
        
        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files (if needed)
    location /_next/static {
        proxy_pass http://nextjs_backend/_next/static;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }
}
