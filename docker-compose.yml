services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
      - .env.local
    environment:
      # Node Environment
      - NODE_ENV=production
      # Next Auth
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Persist uploaded files
      - uploads_data:/app/public/uploads
    restart: always
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=blog_owner
      - POSTGRES_PASSWORD=I82HcwNASRPe
      - POSTGRES_DB=blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
