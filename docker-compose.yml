# ============================================================================
# Self-hosted Docker Compose for Financial Market Blog.
# ----------------------------------------------------------------------------
# سه سرویس:
#   - web:   اپ Next.js (production build با output: 'standalone')
#   - db:    PostgreSQL 15
#   - cron:  sidecar که هر دقیقه endpointهای cron را صدا می‌زند
#
# قبل از up:
#   1) cp .env.example .env  → مقادیر واقعی را پر کن (DATABASE_URL, NEXTAUTH_URL, CRON_SECRET)
#   2) docker compose up -d --build
#
# رانتایم سبک (۲۰۲۶): به‌جای Docker Desktop از Podman استفاده می‌شود.
# Podman دیمِن سنگین ندارد و از همین فایل compose پشتیبانی می‌کند.
# نصب:  winget install -e --id RedHat.Podman
# بعد از هر بوت (یک‌بار):  podman machine start
# سوکت Podman روی npipe:////./pipe/docker_engine باز می‌شود و چون DOCKER_HOST
# ست شده، خودِ دستورات docker compose زیر مستقیماً به Podman وصل می‌شوند.
#
# دستورات:
#   docker compose ps               # وضعیت
#   docker compose logs -f web      # لاگ اپ
#   docker compose logs -f cron     # لاگ cron
#   docker compose down             # خاموش کردن (ولی volumes حفظ می‌شوند)
#   docker compose down -v          # پاک کردن کامل (دیتابیس و آپلودها)
# ============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fm-blog-web:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
      - .env.local
    environment:
      # در production حتماً APP_URL و NEXTAUTH_URL با دامنه‌ی واقعی ست شود
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # در کانتینر، دیتابیس با hostname «db» در دسترس است (نه localhost)
      - DATABASE_URL=postgresql://blog_owner:${POSTGRES_PASSWORD}@db:5432/blog?sslmode=disable
      - DIRECT_URL=postgresql://blog_owner:${POSTGRES_PASSWORD}@db:5432/blog?sslmode=disable
    volumes:
      # آپلودها بیرون از image نگه داشته می‌شوند تا با redeploy پاک نشوند
      - uploads_data:/app/public/uploads
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: registry.docker.ir/postgres:15-alpine
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blog_owner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog_owner} -d ${POSTGRES_DB:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  cron:
    # Sidecar که هر دقیقه endpointهای cron را صدا می‌زند.
    # اگه می‌خواهی system cron هاست استفاده کنی، این سرویس را غیرفعال کن.
    build:
      context: .
      dockerfile: Dockerfile.cron
    image: fm-blog-cron:latest
    environment:
      - APP_URL=http://web:3000
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET must be set}
      - TZ=${TZ:-Asia/Tehran}
    depends_on:
      web:
        condition: service_healthy
    restart: always
    networks:
      - app-network

volumes:
  postgres_data:
  uploads_data:

networks:
  app-network:
    driver: bridge