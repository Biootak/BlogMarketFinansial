<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>اتصال برقرار نیست | آفلاین</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f7f8fa;
        --canvas-dark: #14171f;
        --ink: #1f2430;
        --ink-dark: #eef1f6;
        --muted: #6b7280;
        --muted-dark: #9aa3b2;
        --accent: #06b6d4;
        --card: #ffffff;
        --card-dark: #1c212b;
        --border: #e5e7eb;
        --border-dark: #2a3040;
        --ring: rgba(6, 182, 212, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Vazirmatn", "Segoe UI", Tahoma, Arial, sans-serif;
        background: var(--canvas);
        color: var(--ink);
        padding: 1.5rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: var(--canvas-dark);
          color: var(--ink-dark);
        }
        .card {
          background: var(--card-dark);
          border-color: var(--border-dark);
        }
        .muted {
          color: var(--muted-dark);
        }
        .divider {
          border-color: var(--border-dark);
        }
      }

      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        display: grid;
        place-items: center;
        background: rgba(6, 182, 212, 0.12);
        color: var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.75;
        }
      }

      .code {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        background: rgba(6, 182, 212, 0.12);
        color: var(--accent);
        margin-bottom: 0.75rem;
      }

      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
        font-weight: 800;
      }

      p {
        margin: 0 0 1.25rem;
        line-height: 1.8;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .muted {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 1rem;
        margin-bottom: 0;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.25rem 0 1rem;
      }

      button {
        font: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid transparent;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.98);
      }

      button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }

      .dot {
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: middle;
        margin-inline-start: 0.35rem;
        animation: blink 1.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0" />
          <path d="M1.42 9a16 16 0 0 1 21.16 0" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <span class="code">OFFLINE</span>
      <h1>اتصال برقرار نیست</h1>
      <p>به نظر می‌رسد اتصال اینترنت شما قطع شده است. می‌توانید دوباره امتحان کنید؛ به محض برقراری اتصال، به‌طور خودکار به صفحهٔ قبلی برمی‌گردید.</p>
      <button type="button" id="retry">تلاش مجدد</button>
      <hr class="divider" />
      <p class="muted"><span class="dot" aria-hidden="true"></span>در انتظار اتصال مجدد…</p>
    </main>
    <script>
      // دکمهٔ تلاش مجدد — بازبارگذاری فوری.
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });

      // وقتی اتصال برگشت، خودکار reload کن.
      window.addEventListener("online", function () {
        window.location.reload();
      });

      // اگر آنلاین بودیم ولی سرور جواب نمی‌دهد، هر چند ثانیه دوباره تست کن.
      async function checkNetworkAndReload() {
        try {
          var res = await fetch(".", { cache: "no-store" });
          if (res.status >= 200 && res.status < 500) {
            window.location.reload();
            return;
          }
        } catch (e) {
          // هنوز آفلاین — صبر کن و دوباره.
        }
        window.setTimeout(checkNetworkAndReload, 2500);
      }
      checkNetworkAndReload();
    </script>
  </body>
</html>
