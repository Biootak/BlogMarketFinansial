<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <!-- big watch -->
  <g transform="translate(420,400)">
    <circle r="220" fill="#0f172a" stroke="#94a3b8" stroke-width="4"/>
    <circle r="200" fill="none" stroke="#475569" stroke-width="1"/>
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-190" x2="0" y2="-160"/>
      <line x1="190" y1="0" x2="160" y2="0"/>
      <line x1="0" y1="190" x2="0" y2="160"/>
      <line x1="-190" y1="0" x2="-160" y2="0"/>
    </g>
    <line x1="0" y1="-100" x2="0" y2="0" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <circle r="6" fill="#fbbf24"/>
  </g>
  <!-- trading panel -->
  <g transform="translate(720,200)">
    <rect width="480" height="420" fill="#0c1424" stroke="#475569" stroke-width="1" rx="8"/>
    <rect width="480" height="36" fill="#1e293b" rx="8"/>
    <text x="20" y="22" font-family="system-ui" font-size="11" fill="#94a3b8" letter-spacing="2">SIGNAL · سیگنال معاملاتی</text>
    <text x="20" y="80" font-family="system-ui" font-size="18" font-weight="700" fill="#22c55e">BUY · خرید</text>
    <text x="20" y="110" font-family="system-ui" font-size="12" fill="#cbd5e1">Entry: 64,250</text>
    <text x="20" y="130" font-family="system-ui" font-size="12" fill="#22c55e">TP1: 65,000 (+1.2%)</text>
    <text x="20" y="150" font-family="system-ui" font-size="12" fill="#22c55e">TP2: 66,500 (+3.5%)</text>
    <text x="20" y="170" font-family="system-ui" font-size="12" fill="#ef4444">SL: 63,000 (-2.0%)</text>
    <g transform="translate(20,200)">
      <rect width="440" height="180" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="4"/>
      <polyline points="20,140 80,120 140,100 200,90 260,70 320,60 380,40 420,30" stroke="#22c55e" stroke-width="2" fill="none"/>
      <line x1="20" y1="100" x2="420" y2="100" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    </g>
  </g>
  <g font-family="system-ui" fill="#cbd5e1">
    <text x="80" y="160" font-size="28" font-weight="600" letter-spacing="2">TIMING · زمان‌بندی</text>
  </g>
</svg>
