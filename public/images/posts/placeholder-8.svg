<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <!-- dashboard mock -->
  <g transform="translate(80,200)">
    <rect width="1120" height="500" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="12"/>
    <!-- header -->
    <rect width="1120" height="50" fill="#1e293b" rx="12"/>
    <circle cx="24" cy="25" r="6" fill="#ef4444"/>
    <circle cx="44" cy="25" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="25" r="6" fill="#22c55e"/>
    <text x="540" y="32" text-anchor="middle" font-family="system-ui" font-size="13" fill="#94a3b8">PORTFOLIO · سبد سرمایه‌گذاری</text>
    <!-- stat cards -->
    <g transform="translate(30,80)">
      <rect width="240" height="100" fill="#0c1424" stroke="#1e293b" stroke-width="1" rx="8"/>
      <text x="20" y="30" font-family="system-ui" font-size="10" fill="#94a3b8" letter-spacing="1.5">TOTAL VALUE</text>
      <text x="20" y="60" font-family="system-ui" font-size="22" font-weight="700" fill="#22c55e">$128,450</text>
      <text x="20" y="80" font-family="system-ui" font-size="11" fill="#22c55e">+2.4% ↑ امروز</text>
    </g>
    <g transform="translate(290,80)">
      <rect width="240" height="100" fill="#0c1424" stroke="#1e293b" stroke-width="1" rx="8"/>
      <text x="20" y="30" font-family="system-ui" font-size="10" fill="#94a3b8" letter-spacing="1.5">PROFIT</text>
      <text x="20" y="60" font-family="system-ui" font-size="22" font-weight="700" fill="#22c55e">+$3,012</text>
      <text x="20" y="80" font-family="system-ui" font-size="11" fill="#94a3b8">این ماه</text>
    </g>
    <g transform="translate(550,80)">
      <rect width="240" height="100" fill="#0c1424" stroke="#1e293b" stroke-width="1" rx="8"/>
      <text x="20" y="30" font-family="system-ui" font-size="10" fill="#94a3b8" letter-spacing="1.5">WIN RATE</text>
      <text x="20" y="60" font-family="system-ui" font-size="22" font-weight="700" fill="#3b82f6">68%</text>
      <text x="20" y="80" font-family="system-ui" font-size="11" fill="#94a3b8">۱۲ معامله فعال</text>
    </g>
    <g transform="translate(810,80)">
      <rect width="240" height="100" fill="#0c1424" stroke="#1e293b" stroke-width="1" rx="8"/>
      <text x="20" y="30" font-family="system-ui" font-size="10" fill="#94a3b8" letter-spacing="1.5">RISK</text>
      <text x="20" y="60" font-family="system-ui" font-size="22" font-weight="700" fill="#fbbf24">متوسط</text>
      <text x="20" y="80" font-family="system-ui" font-size="11" fill="#94a3b8">R/R 1:2.4</text>
    </g>
    <!-- big chart -->
    <g transform="translate(30,200)">
      <rect width="1020" height="270" fill="#0c1424" stroke="#1e293b" stroke-width="1" rx="8"/>
      <text x="20" y="30" font-family="system-ui" font-size="11" fill="#94a3b8">PERFORMANCE · ۳۰ روز اخیر</text>
      <g opacity="0.9" stroke="#3b82f6" stroke-width="2" fill="none">
        <polyline points="20,210 100,180 180,200 260,160 340,170 420,140 500,150 580,110 660,130 740,90 820,110 900,70 980,90 1000,80"/>
      </g>
      <g opacity="0.4" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="4 4">
        <polyline points="20,220 100,210 180,200 260,190 340,180 420,170 500,160 580,150 660,140 740,130 820,120 900,110 980,100 1000,95"/>
      </g>
    </g>
  </g>
  <g font-family="system-ui" fill="#3b82f6">
    <text x="80" y="160" font-size="28" font-weight="600" letter-spacing="2">PORTFOLIO · سبد</text>
  </g>
