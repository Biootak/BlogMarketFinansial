<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="50%" stop-color="#2a1c0a"/>
      <stop offset="100%" stop-color="#0e0a05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <!-- grid lines -->
  <g opacity="0.06" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="640" y1="0" x2="640" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>
  <!-- big coin -->
  <g transform="translate(820,360)">
    <circle r="240" fill="url(#coin)" opacity="0.95"/>
    <circle r="240" fill="none" stroke="#fde68a" stroke-width="3" opacity="0.4"/>
    <circle r="200" fill="none" stroke="#92400e" stroke-width="2" opacity="0.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="serif" font-size="220" font-weight="700" fill="#7c2d12" opacity="0.85">₿</text>
  </g>
  <!-- chart line -->
  <g opacity="0.7" stroke="#fbbf24" stroke-width="2.5" fill="none">
    <polyline points="60,640 180,580 280,600 380,520 480,540 580,460 680,420 780,360 880,300 980,260"/>
  </g>
  <g opacity="0.4" stroke="#fbbf24" stroke-width="1" fill="none" stroke-dasharray="4 4">
    <polyline points="60,720 180,700 280,710 380,680 480,690 580,650 680,640 780,610 880,590 980,560"/>
  </g>
  <!-- candles -->
  <g>
    <rect x="120" y="540" width="14" height="60" fill="#22c55e" opacity="0.7"/>
    <rect x="170" y="500" width="14" height="80" fill="#ef4444" opacity="0.7"/>
    <rect x="220" y="560" width="14" height="50" fill="#22c55e" opacity="0.7"/>
    <rect x="270" y="510" width="14" height="70" fill="#ef4444" opacity="0.7"/>
  </g>
  <!-- text -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#fbbf24" opacity="0.95">
    <text x="80" y="160" font-size="28" font-weight="600" letter-spacing="2">GOLD · طلا</text>
    <text x="80" y="200" font-size="14" opacity="0.5">bazar.com · market pulse</text>
  </g>
</svg>
